name: Deploy

# Phase 6: builds backend/ai-service images natively for both linux/amd64 and linux/arm64 — no
# QEMU cross-build, each platform builds on its own native GitHub-hosted runner (this repo is
# public, so both ubuntu-24.04 and the ARM64 ubuntu-24.04-arm runner are free) — then publishes
# both platform-specific tags to GHCR and merges them into one manifest list per image, so a
# single tag works on either an x86_64 or an ARM64 deploy host. Host is deliberately undecided
# until submission (see CLAUDE.md's Phase 6 STATUS block: OCI is blocked on payment verification,
# AWS has been cancelled) — this workflow doesn't assume either.
#
# Model artifacts (ai-service/artifacts/) are committed directly to the repo (Phase 6 CI/CD fix —
# previously fetched from OCI Object Storage at build time; that step and its secrets were removed
# when OCI became blocked). Publishing a new model version stays a separate, manual step
# (ai-service/scripts/publish_model_artifacts.py, kept for a possible future OCI Object Storage
# path) — this workflow only ever builds from whatever is already committed; it never trains.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image-names:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      ai_service: ${{ steps.names.outputs.ai_service }}
    steps:
      - name: Compute lowercase image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${{ env.REGISTRY }}/${REPO_LOWER}-backend" >> "$GITHUB_OUTPUT"
          echo "ai_service=${{ env.REGISTRY }}/${REPO_LOWER}-ai-service" >> "$GITHUB_OUTPUT"

  build-backend-amd64:
    needs: image-names
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.image-names.outputs.backend }}:${{ github.sha }}-amd64

  build-backend-arm64:
    needs: image-names
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ needs.image-names.outputs.backend }}:${{ github.sha }}-arm64

  build-ai-service-amd64:
    needs: image-names
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ai-service.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.image-names.outputs.ai_service }}:${{ github.sha }}-amd64

  build-ai-service-arm64:
    needs: image-names
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ai-service.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ needs.image-names.outputs.ai_service }}:${{ github.sha }}-arm64

  publish-manifests:
    needs: [image-names, build-backend-amd64, build-backend-arm64, build-ai-service-amd64, build-ai-service-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      backend_image: ${{ steps.tags.outputs.backend_image }}
      ai_service_image: ${{ steps.tags.outputs.ai_service_image }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Merge backend amd64+arm64 images into one manifest list
        run: |
          docker buildx imagetools create \
            -t ${{ needs.image-names.outputs.backend }}:${{ github.sha }} \
            ${{ needs.image-names.outputs.backend }}:${{ github.sha }}-amd64 \
            ${{ needs.image-names.outputs.backend }}:${{ github.sha }}-arm64
      - name: Merge ai-service amd64+arm64 images into one manifest list
        run: |
          docker buildx imagetools create \
            -t ${{ needs.image-names.outputs.ai_service }}:${{ github.sha }} \
            ${{ needs.image-names.outputs.ai_service }}:${{ github.sha }}-amd64 \
            ${{ needs.image-names.outputs.ai_service }}:${{ github.sha }}-arm64
      - id: tags
        run: |
          echo "backend_image=${{ needs.image-names.outputs.backend }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ai_service_image=${{ needs.image-names.outputs.ai_service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the target host over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ai-crypto-predictor
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            export BACKEND_IMAGE="${{ needs.publish-manifests.outputs.backend_image }}"
            export AI_SERVICE_IMAGE="${{ needs.publish-manifests.outputs.ai_service_image }}"
            docker compose pull backend ai-service || true
            docker compose up -d --no-build
            docker image prune -f
            # Flyway migrations run automatically on backend startup (spring.flyway.enabled) —
            # no separate migration step needed here.
