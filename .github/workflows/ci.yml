name: CI

# Phase 6: runs on every push/PR — backend/Android/ai-service tests, cloud-target-agnostic (see
# CLAUDE.md's Phase 6 plan §5). Separate from deploy.yml, which only runs on push to main.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stockpredictor_test
          POSTGRES_USER: stockpredictor_app
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run backend tests
        working-directory: backend
        env:
          DB_USERNAME: stockpredictor_app
          DB_PASSWORD: ci_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./gradlew test --console=plain

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Write placeholder local.properties
        # CI never has real Firebase/CoinGecko/Maps credentials — compileDebugKotlin/assembleDebug
        # only need the build to succeed, not a working app, so empty keys are fine here (contrast
        # with deploy.yml, which never runs this job's placeholder path for a release artifact).
        run: |
          echo "COINGECKO_API_KEY=" >> local.properties
          echo "MAPS_API_KEY=" >> local.properties
          echo "BACKEND_BASE_URL=http://10.0.2.2:8080/" >> local.properties
      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin --console=plain
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: ai-service
        run: python -m pytest -q
