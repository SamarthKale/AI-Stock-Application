distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# Phase 6: the default 10000ms connect/read timeout (and 0 retries) is tuned for a fast bare-host
# network path. It is measurably too tight for a Docker buildx cross-arch (linux/arm64 via QEMU
# emulation on an x86_64 host) build, where the outbound TCP path to services.gradle.org is slower
# -- this was the exact, reproducible cause of the wrapper download failing identically on every
# retry (0 configured retries means a single slow connection attempt had no chance to recover).
# 60s + 3 retries is bounded (worst case ~3 minutes before giving up) and applies identically to
# every gradlew invocation everywhere (CI, local, Docker) -- not a Docker-specific workaround, and
# it changes nothing about TLS/certificate validation.
networkTimeout=60000
retries=3
retryBackOffMs=1000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
