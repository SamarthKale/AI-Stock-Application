spring:
  application:
    name: stockpredictor-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockpredictor}
    username: ${DB_USERNAME:stockpredictor_app}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (db/migration) — Hibernate only validates entity mappings
      # against it at startup, it never generates or alters DDL itself.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Phase 6: self-hosted Redis (Docker Compose service on the OCI VM, or localhost in dev) —
  # cache + distributed rate limiting, coordinated across every backend process/thread sharing
  # this instance. No password by default (Redis container is never exposed outside the Compose
  # network / VM loopback — see docker-compose.yml/nginx config), overridable via REDIS_PASSWORD
  # for defense-in-depth.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Phase 5: FastAPI prediction service. cache-ttl-minutes governs PredictionService's
# Postgres-backed cache (Redis deliberately deferred — see Phase 5 plan section 10).
prediction-service:
  base-url: ${PREDICTION_SERVICE_URL:http://localhost:8000}
  cache-ttl-minutes: ${PREDICTION_CACHE_TTL_MINUTES:20}
  # Phase 6: PredictionRateLimiter's per-uid cap — protects the AI service's inference cost
  # (predictions are coin-scoped, not user-scoped, but the rate limit itself is still per-uid,
  # same reasoning as ChatbotRateLimiter). Higher than chatbot's default since this endpoint backs
  # ordinary quote-viewing traffic (Crypto Detail/Predictions tab), not a chat conversation.
  rate-limit-per-hour: ${PREDICTION_RATE_LIMIT_PER_HOUR:60}

# Phase 5b: Gemini chatbot proxy. api-key is env-only (no literal default, matching
# DB_PASSWORD's pattern) -- never committed, never sent to Android (GeminiChatbotClient is the
# only place it's read). model has no fixed default baked into code -- Gemini's free-tier model
# lineup changes over time, so it's set here, externally overridable via GEMINI_MODEL.
# rate-limit-per-hour is ChatbotRateLimiter's per-uid cap -- the DoD's required cost-control
# measure for an endpoint proxying a metered, paid third-party API.
chatbot:
  base-url: https://generativelanguage.googleapis.com
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  rate-limit-per-hour: ${CHATBOT_RATE_LIMIT_PER_HOUR:20}

# Phase 5c: CoinGecko market-data client, used only by AlertRuleService (the backend's first-ever
# market-data integration -- deliberately added because a server-scheduled alert job has no other
# way to know current prices; see the Phase 5c plan). Reuses the same Demo-tier key Android
# already uses -- fine at this project's scale (one low-frequency scheduled job, well within the
# ~30 calls/min budget), sourced via env var, never committed.
coingecko:
  base-url: https://api.coingecko.com/api/v3
  api-key: ${COINGECKO_API_KEY:}

# Phase 5c: AI-driven FCM alerts. No "market hours" gating (crypto trades 24/7) -- interval-minutes
# is a plain continuous cadence, config-driven so it can be "manually lowered temporarily" for
# demoing (same DoD instruction CLAUDE.md's stock-era spec used for thresholds). Neither threshold
# is hardcoded in code.
alerts:
  enabled: ${ALERTS_ENABLED:true}
  interval-minutes: ${ALERTS_INTERVAL_MINUTES:10}
  price-move-threshold-pct: ${ALERTS_PRICE_MOVE_THRESHOLD_PCT:5.0}
  confidence-threshold: ${ALERTS_CONFIDENCE_THRESHOLD:70.0}
  cooldown-minutes: ${ALERTS_COOLDOWN_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never let Spring's default error page leak stack traces / raw exception text to a client —
    # GlobalExceptionHandler is the only source of error response bodies.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
